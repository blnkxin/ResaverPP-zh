name: Upload to Nexus Mods

# Manual release: Actions tab -> "Upload to Nexus Mods" -> Run workflow.
# Builds ReSaver++ from the current main with MinGW-w64 (same toolchain as the earlier releases), packages
# ReSaverPP.exe + resaverpp-cli.exe + LICENSE/NOTICE/README, and uploads the zip as a new version of the main file.
#
# Needs, in the "nexus" environment (Settings -> Environments -> nexus):
#   secret   NEXUSMODS_API_KEY  - personal API key from nexusmods.com/settings/api-keys
# File ID 8208150 and Unique Mod ID 7318624468677 are the defaults below (Files tab -> Advanced -> API).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version shown on Nexus (e.g. 12)"
        required: true
      changelog:
        description: "Changelog text (optional, plain text; use ' | ' to separate lines)"
        required: false
        default: ""
      file_id:
        description: "Nexus File ID of the main file (Files tab -> Advanced -> API -> File ID)"
        required: false
        default: "8208150"
      mod_id:
        description: "Nexus Unique Mod ID (same dialog), so the changelog is attached"
        required: false
        default: "7318624468677"
      description:
        description: "File description on the Files tab (optional; default: the changelog, cut to 250 characters)"
        required: false
        default: ""
      display_name:
        description: "File name shown on Nexus"
        required: false
        default: "ReSaverPP"
      mod_manager:
        description: "Allow mod manager downloads (false = manual download only)"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-24.04
    environment: nexus
    steps:
      - name: Check settings
        env:
          FILE_ID: ${{ inputs.file_id || vars.NEXUSMODS_FILE_ID }}
          MOD_ID: ${{ inputs.mod_id || vars.NEXUSMODS_MOD_ID }}
          HAS_KEY: ${{ secrets.NEXUSMODS_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then echo "::error::Secret NEXUSMODS_API_KEY is missing in the nexus environment"; exit 1; fi
          if [ -z "$FILE_ID" ]; then echo "::error::No File ID: set variable NEXUSMODS_FILE_ID in the nexus environment or fill in file_id"; exit 1; fi
          if [ -z "$MOD_ID" ]; then echo "::warning::Variable NEXUSMODS_MOD_ID is not set - the changelog may not be attached"; fi

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check the version number matches
        env:
          VERSION: ${{ inputs.version }}
        run: |
          grep -q "project(ReSaverPP VERSION ${VERSION} " CMakeLists.txt || { echo "::error::CMakeLists.txt is not version ${VERSION}"; exit 1; }

      # apt on the runner sometimes hangs for a long time on a slow mirror: each try is cut off after
      # 4 minutes and retried, so a stuck mirror costs minutes, not the whole run
      - name: Install MinGW-w64
        timeout-minutes: 15
        run: |
          for i in 1 2 3; do
            if sudo timeout 240 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -q &&
               sudo timeout 240 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -q mingw-w64 ninja-build; then
              exit 0
            fi
            echo "::warning::apt try $i failed or timed out, retrying"
            sleep 10
          done
          exit 1

      # the regression tests (no save files needed) must pass before anything is built for release
      - name: Run tests
        run: |
          cmake -S . -B build-test -G Ninja -DCMAKE_BUILD_TYPE=Release -DRESAVERPP_GUI=OFF -DRESAVERPP_TESTS=ON
          cmake --build build-test -j4
          ctest --test-dir build-test --output-on-failure

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64.cmake -DCMAKE_BUILD_TYPE=Release -DRESAVERPP_TESTS=OFF
          cmake --build build -j4
          for f in build/ReSaverPP.exe build/resaverpp-cli.exe; do
            if [ ! -f "$f" ]; then echo "::error::MISSING $f - not uploading"; exit 1; fi
          done

      - name: Package
        run: |
          zip -j -q ReSaverPP.zip build/ReSaverPP.exe build/resaverpp-cli.exe LICENSE NOTICE.md README.md
          unzip -l ReSaverPP.zip

      - name: Keep the zip (Actions run -> Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ReSaverPP-${{ inputs.version }}
          path: ReSaverPP.zip

      - name: Format changelog
        id: log
        if: ${{ inputs.changelog != '' }}
        env:
          TEXT: ${{ inputs.changelog }}
        run: |
          {
            echo "text<<CHANGELOG_EOF"
            printf '%s\n' "$TEXT" | sed 's/ | /\n/g'
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # The file's own description on the Files tab (Nexus keeps it short): what changed in this version.
      - name: File description
        id: desc
        env:
          TEXT: ${{ inputs.description || inputs.changelog }}
          VERSION: ${{ inputs.version }}
        run: |
          d="$(printf '%s' "$TEXT" | sed 's/ | /; /g')"
          case "$d" in [Vv]ersion*) ;; *) d="Version $VERSION: $d" ;; esac  # no "Version x: Version x:"
          if [ ${#d} -gt 250 ]; then d="${d:0:246}..."; fi
          echo "text=$d" >> "$GITHUB_OUTPUT"

      # The changelog is posted BEFORE the file: an entry added through the API only shows on the
      # Changelogs tab once Nexus rebuilds the page, and the upload is what makes it rebuild.
      - name: Post changelog
        if: ${{ inputs.changelog != '' }}
        env:
          KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          MOD_ID: ${{ inputs.mod_id || vars.NEXUSMODS_MOD_ID }}
          VERSION: ${{ inputs.version }}
          TEXT: ${{ steps.log.outputs.text }}
        run: |
          body=$(jq -n --arg v "$VERSION" --arg c "$TEXT" '{version: $v, changelog: $c}')
          code=$(curl -sS -o resp.json -w '%{http_code}' -X POST \
            -H "apikey: $KEY" -H "Content-Type: application/json" -H "User-Agent: ReSaverPP-release" \
            --data "$body" "https://api.nexusmods.com/v3/mods/$MOD_ID/changelogs")
          echo "HTTP $code"
          cat resp.json; echo
          if [ "$code" != "201" ]; then echo "::error::Nexus refused the changelog (HTTP $code): $(head -c 300 resp.json)"; exit 1; fi

      - name: Upload to Nexus Mods
        uses: Nexus-Mods/upload-action@main
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ inputs.file_id || vars.NEXUSMODS_FILE_ID }}
          filename: ReSaverPP.zip
          display_name: ${{ inputs.display_name }}
          description: ${{ steps.desc.outputs.text }}
          version: ${{ inputs.version }}
          mod_id: ${{ inputs.mod_id || vars.NEXUSMODS_MOD_ID }}
          category: main
          allow_mod_manager_download: ${{ inputs.mod_manager }}
          primary_mod_manager_download: false
          update_mod_version: true
